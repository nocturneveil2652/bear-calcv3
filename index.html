<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>熊ダメ計算機 v3.4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>熊ダメ計算機 <span class="version-tag">v3.4</span></h1>
        <span class="sub-title" id="editionLabel" onclick="cycleMember()">るびぃedition</span>
    </header>

    <div class="section">
        <span class="title">各種設定</span>
        <div class="label-row">
            <div></div><div class="label-text">火晶</div><div class="label-text">兵士Tier</div><div></div><div class="label-text">攻撃力</div><div class="label-text">殺傷力</div>
        </div>
        <div class="grid">
            <div class="tag" onclick="tg('I')">盾</div>
            <select id="fci" onchange="sy()"></select><select id="ti" onchange="sy()"></select>
            <div class="v-line"></div>
            <input type="number" id="bAi" value="0.0" step="0.1" oninput="sy()"><input type="number" id="bKi" value="0.0" step="0.1" oninput="sy()">
        </div>
        <div class="grid">
            <div class="tag" onclick="tg('L')">槍</div>
            <select id="fcl" onchange="sy()"></select><select id="tl" onchange="sy()"></select>
            <div class="v-line"></div>
            <input type="number" id="bAl" value="0.0" step="0.1" oninput="sy()"><input type="number" id="bKl" value="0.0" step="0.1" oninput="sy()">
        </div>
        <div class="grid">
            <div class="tag" onclick="tg('A')">弓</div>
            <select id="fca" onchange="sy()"></select><select id="ta" onchange="sy()"></select>
            <div class="v-line"></div>
            <input type="number" id="bAa" value="0.0" step="0.1" oninput="sy()"><input type="number" id="bKa" value="0.0" step="0.1" oninput="sy()">
        </div>
    </div>

    <div class="section">
        <div class="status-row">
            <span class="title">出征数：<span id="tDisp">--</span></span>
            <span id="remDisp" class="rem-text">残り：0%</span>
        </div>
        <div class="ctrl-row">
            <button class="btn-s" onclick="st('tr',-1000)">−</button>
            <input type="range" id="tr" min="1000" max="1000000" step="1000" value="100000" oninput="sy()">
            <button class="btn-s" onclick="st('tr',1000)">＋</button>
        </div>
        
        <div class="percentage-group">
            <div class="兵種別-row" id="row-I">
                <div class="input-header">
                    <div class="input-main"><div class="u-btn active" id="mI" onclick="tg('I')">割合</div><input type="number" id="iI" value="33" oninput="hi('I')"></div>
                    <div id="sI" class="count-disp"></div>
                </div>
                <div class="ctrl-row">
                    <button class="btn-s" onclick="st('iI',-1)">−</button>
                    <input type="range" id="rI" min="0" max="100" value="33" oninput="sl('I')">
                    <button class="btn-s" onclick="st('iI',1)">＋</button>
                </div>
            </div>
            <div class="兵種別-row" id="row-L">
                <div class="input-header">
                    <div class="input-main"><div class="u-btn active" id="mL" onclick="tg('L')">割合</div><input type="number" id="iL" value="33" oninput="hi('L')"></div>
                    <div id="sL" class="count-disp"></div>
                </div>
                <div class="ctrl-row">
                    <button class="btn-s" onclick="st('iL',-1)">−</button>
                    <input type="range" id="rL" min="0" max="100" value="33" oninput="sl('L')">
                    <button class="btn-s" onclick="st('iL',1)">＋</button>
                </div>
            </div>
            <div class="兵種別-row" id="row-A">
                <div class="input-header">
                    <div class="input-main"><div class="u-btn active" id="mA" onclick="tg('A')">割合</div><input type="number" id="iA" value="34" oninput="hi('A')"></div>
                    <div id="sA" class="count-disp"></div>
                </div>
                <div class="ctrl-row">
                    <button class="btn-s" onclick="st('iA',-1)">−</button>
                    <input type="range" id="rA" min="0" max="100" value="34" oninput="sl('A')">
                    <button class="btn-s" onclick="st('iA',1)">＋</button>
                </div>
            </div>
        </div>
    </div>

    <div class="res-box">
        <div id="resDmg">0</div>
        <div class="res-label">推定合計ダメージ</div>
    </div>

    <div class="best-box">
        <span id="bT" class="best-text">---</span><br>
        <span id="bDMG" class="best-dmg">推奨時の推定ダメ: 0</span>
    </div>

    <button onclick="rs()" class="reset-all">全てリセット</button>

    <div class="log-section">
        <details>
            <summary class="log-summary">📊 計算プロセスを確認</summary>
            <div class="log" id="log"></div>
        </details>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
